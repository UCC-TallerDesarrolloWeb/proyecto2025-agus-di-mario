<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Agustín Di Mario">
  <meta name="description" content="Colección de álbumes musicales con reseñas">
  <meta name="keywords" content="Música, Álbumes, Reseñas, Colección">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="imagenes/favicon.png">

<body>
  <header>
    <h1>Mi Colección de Álbumes</h1>
    <nav>
        <label for="busqueda"></label><input type="text" id="busqueda" placeholder="Buscar álbum o artista">
      <button id="boton-buscar" onclick="buscarAlbumes()">Buscar</button>
        <label for="filtro-artista"></label><select id="filtro-artista" onchange="filtrarPorArtista()">
        <option value="">-- Filtrar por artista --</option>
      </select>
      <button id="boton-limpiar" onclick="limpiarDatos()" title="Limpiar todos los datos guardados">Limpiar</button>
      <a href="mi-coleccion.html" class="nav-link">Mi colección</a>
    </nav>
  </header>

  <main>
    <section id="catalogo">
      <h2>Álbumes disponibles</h2>
      <div class="lista-albumes" id="lista-albumes"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 - Agustín Di Mario</p>
  </footer>

  <script src="script.js"></script>

</html>
